<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortune &amp; Favor — Wedding Invitation</title>
  <style>
    :root {
      --white: #ffffff;
      --ivory: #fffdf8;
      --cream: #f9f2e2;
      --gold: #b8860b;
      --gold-bright: #d4af37;
      --gold-soft: #e8d08c;
      --text: #241e12;
      --muted: #66593e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(212, 175, 55, 0.22), transparent 45%),
        radial-gradient(circle at bottom right, rgba(184, 134, 11, 0.25), transparent 50%),
        linear-gradient(135deg, #ffffff 0%, #fcf6e8 48%, #f3e2b8 100%);
      overflow-x: hidden;
    }

    /* ================= SPLASH / ENTRANCE SCREEN ================= */
    #entrance-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      cursor: pointer;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    #entrance-screen.fade-out {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .entrance-frame {
      border: 2px solid var(--gold-soft);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(6px);
      padding: 3.5rem 2.5rem;
      border-radius: 24px;
      max-width: 760px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(184, 134, 11, 0.18);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .entrance-frame:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 60px rgba(184, 134, 11, 0.26);
    }

    .eyebrow {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .hero-names {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 700;
      line-height: 1.08;
      background: linear-gradient(135deg, #8c6200 0%, #d4af37 50%, #9e7208 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.2rem;
    }

    .enter-prompt {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #c6971c, #a47606);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(184, 134, 11, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* ================= MAIN INVITATION PAGE ================= */
    #main-invitation {
      display: none;
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      animation: revealPage 0.9s ease forwards;
    }

    @keyframes revealPage {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--gold-soft);
      border-radius: 22px;
      padding: 2.5rem 2rem;
      box-shadow: 0 18px 45px rgba(184, 134, 11, 0.14);
      text-align: center;
    }

    .couple-header h1 {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      color: var(--gold);
      margin-bottom: 0.4rem;
    }

    .couple-header p {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 560px;
      margin: 0 auto 1.5rem;
    }

    /* Countdown Timer */
    .countdown-wrap {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 0 auto 2rem;
    }

    .time-box {
      background: linear-gradient(180deg, #fffdf9 0%, #faf2de 100%);
      border: 1.5px solid var(--gold-soft);
      border-radius: 12px;
      min-width: 74px;
      padding: 0.7rem 0.6rem;
    }

    .time-box span.num {
      display: block;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.1;
    }

    .time-box span.unit {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* Two-Photo Gallery */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .photo-grid img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid var(--gold-soft);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.09);
      transition: transform 0.3s ease;
    }

    .photo-grid img:hover {
      transform: scale(1.02);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
      margin: 2rem 0;
    }

    /* Event Details & Schedule */
    .section-title {
      font-size: 1.55rem;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem;
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .detail-card {
      background: var(--ivory);
      border: 1px solid var(--gold-soft);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
    }

    .detail-card small {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .detail-card strong {
      font-size: 1.05rem;
      color: var(--text);
      display: block;
    }

    .detail-card p.sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .map-link {
      display: inline-block;
      margin-top: 0.65rem;
      padding: 0.45rem 0.9rem;
      background: var(--gold);
      color: #ffffff;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 7px;
      transition: opacity 0.2s ease;
    }

    .map-link:hover {
      opacity: 0.9;
    }
